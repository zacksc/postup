<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma — Protótipo Desktop</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0d0f14;
    --surf:    #13161e;
    --surf2:   #1c2030;
    --surf3:   #242840;
    --bdr:     rgba(255,255,255,0.07);
    --bdr2:    rgba(255,255,255,0.13);
    --txt:     #e8eaf0;
    --muted:   #6b7080;
    --accent:  #7c6af7;
    --accent2: #a78bfa;
    --c1:#f472b6; --c2:#34d399; --c3:#fb923c; --c4:#60a5fa;
  }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; overflow:hidden; font-size:14px; }

  /* HEADER */
  .hdr { height:52px; background:var(--surf); border-bottom:1px solid var(--bdr); display:flex; align-items:center; padding:0 16px; gap:12px; flex-shrink:0; }
  .logo { font-size:15px; font-weight:600; color:var(--accent2); letter-spacing:-.3px; }
  .hdiv { width:1px; height:18px; background:var(--bdr2); }
  .page-lbl { font-size:13px; color:var(--muted); }
  .hright { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .btn-new { background:var(--accent); color:#fff; border:none; border-radius:7px; padding:6px 13px; font-size:13px; font-weight:500; font-family:inherit; cursor:pointer; }
  .btn-new:hover { opacity:.85; }
  .icon-btn { width:32px; height:32px; background:var(--surf2); border:1px solid var(--bdr); border-radius:7px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); font-size:15px; }
  .icon-btn:hover { color:var(--txt); border-color:var(--bdr2); }
  .avatar { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--accent),#ec4899); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; cursor:pointer; }

  /* BODY */
  .body { display:flex; flex:1; overflow:hidden; }

  /* NAV */
  .nav { width:52px; background:var(--surf); border-right:1px solid var(--bdr); display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:4px; flex-shrink:0; }
  .ni { width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); font-size:17px; transition:background .15s,color .15s; }
  .ni:hover { background:var(--surf2); color:var(--txt); }
  .ni.on { background:rgba(124,106,247,.15); color:var(--accent2); }
  .nb { margin-top:auto; }

  /* MAIN */
  .main { flex:1; display:flex; overflow:hidden; }

  /* CALENDÁRIO */
  .cal-wrap { flex:1; display:flex; flex-direction:column; overflow:hidden; padding:20px; gap:16px; }
  .cal-top { display:flex; align-items:center; gap:10px; }
  .cal-top h2 { font-size:17px; font-weight:600; letter-spacing:-.4px; flex:1; }
  .mnav { width:28px; height:28px; background:var(--surf2); border:1px solid var(--bdr); border-radius:6px; color:var(--muted); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .vtoggle { display:flex; background:var(--surf2); border-radius:7px; padding:3px; gap:2px; }
  .vbtn { padding:4px 11px; border-radius:5px; border:none; background:transparent; color:var(--muted); font-family:inherit; font-size:12px; font-weight:500; cursor:pointer; transition:background .15s,color .15s; }
  .vbtn.on { background:var(--surf3); color:var(--txt); }

  /* chips de cliente */
  .chips { display:flex; gap:7px; flex-wrap:wrap; }
  .chip { display:flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; border:1px solid var(--bdr); background:transparent; color:var(--muted); font-family:inherit; font-size:12px; cursor:pointer; transition:all .15s; }
  .dot { width:7px; height:7px; border-radius:50%; }
  .chip.on[data-c="1"]{background:rgba(244,114,182,.14);border-color:rgba(244,114,182,.3);color:var(--txt);}
  .chip.on[data-c="2"]{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.3);color:var(--txt);}
  .chip.on[data-c="3"]{background:rgba(251,146,60,.14);border-color:rgba(251,146,60,.3);color:var(--txt);}
  .chip.on[data-c="4"]{background:rgba(96,165,250,.14);border-color:rgba(96,165,250,.3);color:var(--txt);}

  /* grade */
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--bdr); border:1px solid var(--bdr); border-radius:11px; overflow:hidden; flex:1; min-height:0; }
  .dh { background:var(--surf); padding:7px 4px; text-align:center; font-size:10px; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .day { background:var(--surf); padding:7px; cursor:pointer; transition:background .12s; display:flex; flex-direction:column; gap:3px; min-height:0; overflow:hidden; }
  .day:hover { background:var(--surf2); }
  .day.om { opacity:.3; pointer-events:none; }
  .day.sel { background:var(--surf3); outline:1.5px solid var(--accent); outline-offset:-1px; }
  .day.tod .dn { background:var(--accent); color:#fff; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; }
  .dn { font-size:11px; font-weight:500; color:var(--muted); width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pill { border-radius:3px; padding:2px 5px; font-size:10px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .pill[data-c="1"]{background:rgba(244,114,182,.18);color:var(--c1);}
  .pill[data-c="2"]{background:rgba(52,211,153,.18);color:var(--c2);}
  .pill[data-c="3"]{background:rgba(251,146,60,.18);color:var(--c3);}
  .pill[data-c="4"]{background:rgba(96,165,250,.18);color:var(--c4);}
  .morepill { font-size:10px; color:var(--muted); padding-left:3px; }

  /* VISÃO SEMANAL */
  .week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--bdr); border:1px solid var(--bdr); border-radius:11px; overflow:hidden; flex:1; min-height:0; }
  .wdh { background:var(--surf); padding:10px 8px 8px; border-bottom:1px solid var(--bdr); display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; }
  .wdh .wday-name { font-size:10px; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .wdh .wday-num { font-size:18px; font-weight:600; letter-spacing:-0.5px; color:var(--muted); width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
  .wdh.tod .wday-num { background:var(--accent); color:#fff; }
  .wdh.sel-col .wday-num { background:var(--surf3); color:var(--txt); outline:1.5px solid var(--accent); }
  .wcol { background:var(--surf); display:flex; flex-direction:column; gap:4px; padding:8px 6px; overflow-y:auto; cursor:pointer; transition:background .12s; min-height:0; }
  .wcol:hover { background:var(--surf2); }
  .wcol.sel-col { background:var(--surf3); }
  .wcol::-webkit-scrollbar{width:2px;} .wcol::-webkit-scrollbar-thumb{background:var(--surf3);}
  .wcard { border-radius:6px; padding:6px 8px; cursor:pointer; transition:opacity .14s; border-left:2px solid transparent; }
  .wcard[data-c="1"]{background:rgba(244,114,182,.12);border-left-color:var(--c1);}
  .wcard[data-c="2"]{background:rgba(52,211,153,.12);border-left-color:var(--c2);}
  .wcard[data-c="3"]{background:rgba(251,146,60,.12);border-left-color:var(--c3);}
  .wcard[data-c="4"]{background:rgba(96,165,250,.12);border-left-color:var(--c4);}
  .wcard:hover{opacity:.8;}
  .wcard.sel{outline:1.5px solid var(--accent);outline-offset:1px;}
  .wcard-time { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; margin-bottom:2px; }
  .wcard-cli { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px; }
  .wcard-cli[data-c="1"]{color:var(--c1);} .wcard-cli[data-c="2"]{color:var(--c2);} .wcard-cli[data-c="3"]{color:var(--c3);} .wcard-cli[data-c="4"]{color:var(--c4);}
  .wcard-cap { font-size:11px; color:var(--txt); line-height:1.35; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; margin-bottom:4px; }
  .wcard-foot { display:flex; align-items:center; gap:4px; }
  .wempty { display:flex; align-items:center; justify-content:center; flex:1; }
  .wempty-dot { width:5px; height:5px; border-radius:50%; background:var(--bdr2); }

  /* PAINEL */
  .panel { width:290px; background:var(--surf); border-left:1px solid var(--bdr); display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; }
  .ph { padding:18px 16px 14px; border-bottom:1px solid var(--bdr); flex-shrink:0; }
  .ph .plbl { font-size:10px; font-weight:500; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin-bottom:3px; }
  .ph .ptitle { font-size:15px; font-weight:600; letter-spacing:-.3px; }
  .pb { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:9px; }
  .pb::-webkit-scrollbar{width:3px;} .pb::-webkit-scrollbar-thumb{background:var(--surf3);border-radius:3px;}

  /* summary */
  .sgrid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .sc { background:var(--surf2); border:1px solid var(--bdr); border-radius:9px; padding:11px; }
  .sc .sn { font-size:22px; font-weight:600; letter-spacing:-1px; line-height:1; margin-bottom:3px; }
  .sc .sl { font-size:10px; color:var(--muted); }
  .sc.cr .sn{color:var(--accent2);} .sc.ap .sn{color:#34d399;} .sc.pe .sn{color:#fb923c;} .sc.pu .sn{color:#60a5fa;}

  /* post card no painel */
  .pcard { background:var(--surf2); border:1px solid var(--bdr); border-radius:9px; padding:11px; cursor:pointer; transition:border-color .14s,background .14s; position:relative; overflow:hidden; }
  .pcard::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; }
  .pcard[data-c="1"]::before{background:var(--c1);} .pcard[data-c="2"]::before{background:var(--c2);}
  .pcard[data-c="3"]::before{background:var(--c3);} .pcard[data-c="4"]::before{background:var(--c4);}
  .pcard:hover{border-color:var(--bdr2);background:var(--surf3);}
  .pcard.sel{border-color:var(--accent);background:rgba(124,106,247,.08);}
  .pt { display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; padding-left:7px; }
  .pcli { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  .pcli[data-c="1"]{color:var(--c1);} .pcli[data-c="2"]{color:var(--c2);} .pcli[data-c="3"]{color:var(--c3);} .pcli[data-c="4"]{color:var(--c4);}
  .ptime { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; }
  .pcap { font-size:11px; color:var(--txt); line-height:1.4; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; padding-left:7px; margin-bottom:7px; }
  .pfot { display:flex; align-items:center; gap:5px; padding-left:7px; }
  .tbadge { font-size:10px; padding:2px 6px; border-radius:4px; background:var(--surf3); color:var(--muted); font-weight:500; }
  .sbadge { font-size:10px; padding:2px 6px; border-radius:4px; font-weight:500; margin-left:auto; }
  .sbadge.publicado{background:rgba(96,165,250,.14);color:#60a5fa;}
  .sbadge.aprovado{background:rgba(52,211,153,.14);color:#34d399;}
  .sbadge.aguardando{background:rgba(251,146,60,.14);color:#fb923c;}
  .sbadge.rascunho{background:rgba(107,112,128,.14);color:var(--muted);}
  .sbadge.alteracao{background:rgba(248,113,113,.14);color:#f87171;}

  /* detalhe */
  .dthumb { width:100%; aspect-ratio:1; border-radius:9px; background:var(--surf2); border:1px solid var(--bdr); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:36px; }
  .dmeta { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .mi { display:flex; flex-direction:column; gap:2px; }
  .mlbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .mval { font-size:12px; font-weight:500; }
  .dcap { font-size:12px; line-height:1.6; color:var(--txt); }
  .fbs { display:flex; flex-direction:column; gap:7px; }
  .fbtitle { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .fb { background:var(--surf2); border:1px solid var(--bdr); border-left:2px solid #f87171; border-radius:7px; padding:9px 11px; font-size:11px; line-height:1.5; }
  .fbauth { font-size:10px; color:var(--muted); margin-top:3px; }
  .dacts { display:flex; gap:7px; }
  .abtn { flex:1; padding:8px; border-radius:7px; border:1px solid var(--bdr); background:var(--surf2); color:var(--txt); font-family:inherit; font-size:12px; font-weight:500; cursor:pointer; transition:all .14s; }
  .abtn:hover{background:var(--surf3);border-color:var(--bdr2);}
  .abtn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
  .abtn.pri:hover{opacity:.85;}
  .backbtn { display:flex; align-items:center; gap:5px; background:none; border:none; color:var(--muted); font-family:inherit; font-size:12px; cursor:pointer; padding:0; transition:color .14s; }
  .backbtn:hover{color:var(--txt);}

  /* empty */
  .empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; color:var(--muted); text-align:center; padding:20px; }
  .empty .ei { font-size:30px; opacity:.4; }
  .empty p { font-size:12px; line-height:1.5; }
  .ecreate { margin-top:4px; padding:7px 14px; border-radius:7px; border:1px dashed var(--bdr2); background:transparent; color:var(--accent2); font-family:inherit; font-size:12px; font-weight:500; cursor:pointer; }
  .ecreate:hover{background:rgba(124,106,247,.1);border-color:var(--accent);}
  .sectitle { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; font-weight:500; padding:3px 0; }
</style>
</head>
<body>

<header class="hdr">
  <span class="logo">postflow</span>
  <div class="hdiv"></div>
  <span class="page-lbl">Cronograma</span>
  <div class="hright">
    <button class="btn-new">＋ Novo post</button>
    <div class="icon-btn">🔔</div>
    <div class="avatar">A</div>
  </div>
</header>

<div class="body">
  <nav class="nav">
    <div class="ni" title="Home">🏠</div>
    <div class="ni on" title="Cronograma">📅</div>
    <div class="ni" title="Clientes">👥</div>
    <div class="ni" title="Feedbacks">💬</div>
    <div class="nb"><div class="ni" title="Config">⚙️</div></div>
  </nav>

  <div class="main">
    <section class="cal-wrap">
      <div class="cal-top">
        <button class="mnav" onclick="changeMonth(-1)">‹</button>
        <h2 id="month-lbl">Março 2026</h2>
        <button class="mnav" onclick="changeMonth(1)">›</button>
        <div style="flex:1"></div>
        <div class="vtoggle">
          <button class="vbtn on" id="vbtn-month" onclick="setView('month')">Mensal</button>
          <button class="vbtn" id="vbtn-week" onclick="setView('week')">Semanal</button>
        </div>
      </div>

      <div class="chips">
        <button class="chip on" data-c="1" onclick="toggleChip(this)"><span class="dot" style="background:var(--c1)"></span>Loja Aurora</button>
        <button class="chip on" data-c="2" onclick="toggleChip(this)"><span class="dot" style="background:var(--c2)"></span>Barbearia Rex</button>
        <button class="chip on" data-c="3" onclick="toggleChip(this)"><span class="dot" style="background:var(--c3)"></span>Studio Fit</button>
        <button class="chip on" data-c="4" onclick="toggleChip(this)"><span class="dot" style="background:var(--c4)"></span>Café Nômade</button>
      </div>

      <div class="grid" id="grid"></div>
      <div class="week-grid" id="week-grid" style="display:none"></div>
    </section>

    <aside class="panel">
      <div class="ph">
        <div class="plbl" id="plbl">Visão geral</div>
        <div class="ptitle" id="ptitle">Março 2026</div>
      </div>
      <div class="pb" id="pb"></div>
    </aside>
  </div>
</div>

<script>
const TODAY = 19;
const posts = [
  {id:1, day:3,  c:1, cn:'Loja Aurora',   type:'Reels',    time:'09:00', cap:'Nova coleção de verão chegou! Confira os looks incríveis que preparamos para você brilhar.', st:'publicado'},
  {id:2, day:3,  c:2, cn:'Barbearia Rex', type:'Foto',     time:'11:00', cap:'Resultado de hoje! Degradê + risca perfeita. Agende seu horário pelo link da bio.', st:'publicado'},
  {id:3, day:5,  c:3, cn:'Studio Fit',    type:'Carrossel',time:'07:00', cap:'5 exercícios para fazer em casa sem equipamento. Salva esse post!', st:'aprovado'},
  {id:4, day:5,  c:1, cn:'Loja Aurora',   type:'Stories',  time:'19:00', cap:'Últimas unidades! Corre no link da bio antes de esgotar.', st:'aprovado'},
  {id:5, day:8,  c:4, cn:'Café Nômade',   type:'Foto',     time:'08:00', cap:'Segunda merece um café especial. Hoje nosso blend etíope está em destaque.', st:'aguardando'},
  {id:6, day:10, c:2, cn:'Barbearia Rex', type:'Reels',    time:'15:00', cap:'Do antes ao depois em 30 segundos. Transformação completa com nosso serviço premium.', st:'aguardando'},
  {id:7, day:12, c:3, cn:'Studio Fit',    type:'Carrossel',time:'06:30', cap:'Plano alimentar da semana! Dicas práticas para manter a dieta no dia a dia.', st:'rascunho'},
  {id:8, day:12, c:1, cn:'Loja Aurora',   type:'Foto',     time:'12:00', cap:'Look do dia ✨ combine peças e crie seu estilo único com nossa nova linha.', st:'alteracao', fbs:[{text:'Trocar por foto com fundo branco, ficou muito escura.',auth:'Cliente'}]},
  {id:9, day:15, c:4, cn:'Café Nômade',   type:'Stories',  time:'09:00', cap:'Horário especial para o feriado: abrimos às 8h e fechamos às 20h.', st:'rascunho'},
  {id:10,day:17, c:1, cn:'Loja Aurora',   type:'Reels',    time:'18:00', cap:'Tutorial: look completo por menos de R$200. Tudo da nossa loja!', st:'rascunho'},
  {id:11,day:17, c:2, cn:'Barbearia Rex', type:'Foto',     time:'10:00', cap:'Novo produto no estoque: pomada fosca premium. Disponível para venda no salão.', st:'aguardando'},
  {id:12,day:17, c:3, cn:'Studio Fit',    type:'Carrossel',time:'07:00', cap:'Treino HIIT de 20 min. Queime calorias em casa sem precisar de academia.', st:'rascunho'},
  {id:13,day:19, c:4, cn:'Café Nômade',   type:'Reels',    time:'11:00', cap:'Preparando o cold brew! Vem ver como fazemos nosso café gelado artesanal.', st:'aguardando'},
  {id:14,day:19, c:1, cn:'Loja Aurora',   type:'Carrossel',time:'14:00', cap:'5 tendências do outono que você precisa conhecer. Qual é seu estilo favorito?', st:'rascunho'},
  {id:15,day:22, c:2, cn:'Barbearia Rex', type:'Stories',  time:'16:00', cap:'Promoção relâmpago! Corte + barba por R$60 até sexta-feira.', st:'rascunho'},
  {id:16,day:25, c:3, cn:'Studio Fit',    type:'Foto',     time:'08:00', cap:'Aluno do mês! Parabéns pela dedicação e pelos resultados incríveis.', st:'rascunho'},
  {id:17,day:28, c:4, cn:'Café Nômade',   type:'Foto',     time:'10:00', cap:'Novo cardápio disponível! Novos sabores de pão de fermentação natural.', st:'rascunho'},
];

let selDay = null, selPost = null;
let filters = new Set([1,2,3,4]);
let currentView = 'month';
// Semana atual: 15-21 março (contendo o dia 19 = hoje)
let currentWeekStart = 15;

const emojis = {Reels:'🎬',Carrossel:'🖼️',Foto:'📷',Stories:'⭕',Design:'🎨'};
const stLabel = {publicado:'Publicado',aprovado:'Aprovado',aguardando:'Aguardando',rascunho:'Rascunho',alteracao:'Em alteração'};
const weekDayNames = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

// Março 2026 começa no domingo → domingo=0
// dia 15 = domingo (15-1=14, 14%7=0 → domingo ✓)
function getDayOfWeek(day){ return (day - 1) % 7; } // 0=dom…6=sáb

function toggleChip(btn){
  const c = parseInt(btn.dataset.c);
  if(filters.has(c)){ if(filters.size===1)return; filters.delete(c); btn.classList.remove('on'); }
  else { filters.add(c); btn.classList.add('on'); }
  if(currentView==='month') renderGrid(); else renderWeek();
  if(selDay) showDay(selDay); else showSummary();
}

function setView(v){
  currentView = v;
  document.getElementById('vbtn-month').classList.toggle('on', v==='month');
  document.getElementById('vbtn-week').classList.toggle('on', v==='week');
  document.getElementById('grid').style.display = v==='month' ? '' : 'none';
  document.getElementById('week-grid').style.display = v==='week' ? '' : 'none';
  if(v==='month'){ renderGrid(); }
  else { renderWeek(); }
  // update header label
  if(v==='week'){
    const end = currentWeekStart + 6;
    document.getElementById('month-lbl').textContent = `${currentWeekStart}–${end} de março 2026`;
  } else {
    document.getElementById('month-lbl').textContent = 'Março 2026';
  }
  if(selDay) showDay(selDay); else showSummary();
}

function changeMonth(dir){
  if(currentView==='week'){
    currentWeekStart += dir * 7;
    if(currentWeekStart < 1) currentWeekStart = 1;
    if(currentWeekStart > 25) currentWeekStart = 25;
    renderWeek();
    const end = Math.min(currentWeekStart+6, 31);
    document.getElementById('month-lbl').textContent = `${currentWeekStart}–${end} de março 2026`;
    selDay = null; selPost = null; showSummary();
  }
}

// ── GRADE MENSAL ──
function renderGrid(){
  const days=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  let h = days.map(d=>`<div class="dh">${d}</div>`).join('');
  for(let d=1;d<=31;d++){
    const dp = posts.filter(p=>p.day===d && filters.has(p.c));
    const isT=d===TODAY, isSel=d===selDay;
    const cls=['day',isT?'tod':'',isSel?'sel':''].filter(Boolean).join(' ');
    const vis=dp.slice(0,2), ex=dp.length-vis.length;
    let pills=vis.map(p=>`<div class="pill" data-c="${p.c}" onclick="clickPill(event,${p.id})">${p.time} ${p.cn}</div>`).join('');
    if(ex>0) pills+=`<div class="morepill">+${ex}</div>`;
    h+=`<div class="${cls}" onclick="clickDay(${d})"><div class="dn">${d}</div>${pills}</div>`;
  }
  const filled=31, rem=42-filled;
  for(let i=1;i<=rem;i++) h+=`<div class="day om"><div class="dn">${i}</div></div>`;
  document.getElementById('grid').innerHTML=h;
}

// ── GRADE SEMANAL ──
function renderWeek(){
  const wg = document.getElementById('week-grid');
  const end = Math.min(currentWeekStart + 6, 31);
  const weekDays = [];
  for(let d=currentWeekStart; d<=end; d++) weekDays.push(d);

  // cabeçalhos
  let headers = weekDays.map(d=>{
    const dow = getDayOfWeek(d);
    const isT = d===TODAY, isSel = d===selDay;
    const cls = ['wdh', isT?'tod':'', isSel?'sel-col':''].filter(Boolean).join(' ');
    return `<div class="${cls}">
      <span class="wday-name">${weekDayNames[dow]}</span>
      <span class="wday-num">${d}</span>
    </div>`;
  }).join('');

  // colunas de posts
  let cols = weekDays.map(d=>{
    const dp = posts.filter(p=>p.day===d && filters.has(p.c))
                    .sort((a,b)=>a.time.localeCompare(b.time));
    const isSel = d===selDay;
    const cls = ['wcol', isSel?'sel-col':''].filter(Boolean).join(' ');

    if(dp.length===0){
      return `<div class="${cls}" onclick="clickDay(${d})">
        <div class="wempty"><div class="wempty-dot"></div></div>
      </div>`;
    }

    const cards = dp.map(p=>`
      <div class="wcard${p.id===selPost?' sel':''}" data-c="${p.c}" onclick="clickWeekCard(event,${p.id})">
        <div class="wcard-time">${p.time}</div>
        <div class="wcard-cli" data-c="${p.c}">${p.cn}</div>
        <div class="wcard-cap">${p.cap}</div>
        <div class="wcard-foot">
          <span class="tbadge">${p.type}</span>
          <span class="sbadge ${p.st}" style="margin-left:auto">${stLabel[p.st]}</span>
        </div>
      </div>
    `).join('');

    return `<div class="${cls}" onclick="clickDay(${d})">${cards}</div>`;
  }).join('');

  wg.innerHTML = headers + cols;
}

// ── PAINEL ──
function showSummary(){
  document.getElementById('plbl').textContent='Visão geral';
  document.getElementById('ptitle').textContent='Março 2026';
  const total=posts.length;
  const ap=posts.filter(p=>['aprovado','publicado'].includes(p.st)).length;
  const pe=posts.filter(p=>['aguardando','alteracao'].includes(p.st)).length;
  const pu=posts.filter(p=>p.st==='publicado').length;
  const atencao=posts.filter(p=>['aguardando','alteracao'].includes(p.st));
  document.getElementById('pb').innerHTML=`
    <div class="sgrid">
      <div class="sc cr"><div class="sn">${total}</div><div class="sl">Criados</div></div>
      <div class="sc ap"><div class="sn">${ap}</div><div class="sl">Aprovados</div></div>
      <div class="sc pe"><div class="sn">${pe}</div><div class="sl">Pendentes</div></div>
      <div class="sc pu"><div class="sn">${pu}</div><div class="sl">Publicados</div></div>
    </div>
    <div class="sectitle" style="margin-top:6px">Precisam de atenção</div>
    ${atencao.map(p=>cardHTML(p)).join('')}
  `;
}

function showDay(day){
  const dp=posts.filter(p=>p.day===day && filters.has(p.c));
  const lbl=day===TODAY?'Hoje':'Dia selecionado';
  const title=day===TODAY?`Hoje, ${day} de março`:`${day} de março`;
  document.getElementById('plbl').textContent=lbl;
  document.getElementById('ptitle').textContent=title;
  if(dp.length===0){
    document.getElementById('pb').innerHTML=`
      <div class="empty">
        <div class="ei">📭</div>
        <p>Nenhum post agendado<br>para este dia.</p>
        <button class="ecreate">＋ Criar post para ${day}/03</button>
      </div>`;
    return;
  }
  document.getElementById('pb').innerHTML=`
    <div class="sectitle">${dp.length} post${dp.length>1?'s':''} agendado${dp.length>1?'s':''}</div>
    ${dp.map(p=>cardHTML(p)).join('')}
  `;
}

function cardHTML(p){
  return `<div class="pcard${p.id===selPost?' sel':''}" data-c="${p.c}" onclick="clickPost(${p.id})">
    <div class="pt"><span class="pcli" data-c="${p.c}">${p.cn}</span><span class="ptime">${p.time}${!selDay?' · '+p.day+'/03':''}</span></div>
    <div class="pcap">${p.cap}</div>
    <div class="pfot"><span class="tbadge">${p.type}</span><span class="sbadge ${p.st}">${stLabel[p.st]}</span></div>
  </div>`;
}

function showDetail(postId){
  const p=posts.find(x=>x.id===postId);
  if(!p)return;
  selPost=postId;
  document.getElementById('plbl').textContent='Detalhe do post';
  document.getElementById('ptitle').textContent=p.cn;
  const fbHTML=p.fbs?.length?`
    <div class="fbs">
      <div class="fbtitle">Feedbacks</div>
      ${p.fbs.map(f=>`<div class="fb">${f.text}<div class="fbauth">— ${f.auth}</div></div>`).join('')}
    </div>`:'';
  const dayLbl=p.day===TODAY?`Hoje, ${p.day}/03`:`${p.day}/03`;
  document.getElementById('pb').innerHTML=`
    <button class="backbtn" onclick="goBack()">← Voltar</button>
    <div class="dthumb">${emojis[p.type]||'📄'}</div>
    <div class="dmeta">
      <div class="mi"><span class="mlbl">Tipo</span><span class="mval">${p.type}</span></div>
      <div class="mi"><span class="mlbl">Horário</span><span class="mval" style="font-family:'DM Mono',monospace">${p.time} · ${dayLbl}</span></div>
      <div class="mi" style="grid-column:1/-1"><span class="mlbl">Status</span><span class="sbadge ${p.st}" style="display:inline-block;margin-top:3px">${stLabel[p.st]}</span></div>
    </div>
    <div class="dcap">${p.cap}</div>
    ${fbHTML}
    <div class="dacts">
      <button class="abtn">✏️ Editar</button>
      <button class="abtn pri">🔗 Compartilhar</button>
    </div>
  `;
}

function clickDay(day){
  selDay=day; selPost=null;
  if(currentView==='month') renderGrid(); else renderWeek();
  showDay(day);
}
function clickPill(e,id){
  e.stopPropagation();
  const p=posts.find(x=>x.id===id); if(!p)return;
  selDay=p.day; selPost=id;
  renderGrid(); showDetail(id);
}
function clickWeekCard(e,id){
  e.stopPropagation();
  const p=posts.find(x=>x.id===id); if(!p)return;
  selDay=p.day; selPost=id;
  renderWeek(); showDetail(id);
}
function clickPost(id){ selPost=id; if(currentView==='month') renderGrid(); else renderWeek(); showDetail(id); }
function goBack(){ selPost=null; if(currentView==='month') renderGrid(); else renderWeek(); if(selDay) showDay(selDay); else showSummary(); }

renderGrid();
showSummary();
</script>
</body>
</html>
