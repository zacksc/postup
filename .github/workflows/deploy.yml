name: Deploy Production

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Secrets VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID não configurados. Deploy pulado; o app permanece no último deploy da Vercel."
            exit 0
          fi
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          # Cloud build na Vercel: usa as env vars REAIS do projeto (não o .env local
          # baixado, que vem mascarado com [SENSITIVE] e quebraria o bundle).
          npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
